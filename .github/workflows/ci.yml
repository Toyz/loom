name: CI

# Previously this gated core and loom-rpc only. analytics, flags, placeholder,
# create-loom and the docs site had no CI at all -- which is how three sibling
# packages came to declare @toyz/loom ^0.12.8 against a core at 0.22.0, and how
# the scaffolder came to promise a test runner it did not ship.
#
# One matrix job now covers every package, driven by scripts/packages.mjs, so
# adding a package is a manifest entry rather than another copied file.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI runs third-party code: dependency install scripts, test suites, build
# plugins. Any of it can read GITHUB_TOKEN out of the environment, so the token
# it finds should not be able to write anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Which packages does this change touch? ──
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      any: ${{ steps.select.outputs.any }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do not leave the token in .git/config for the build to find.
          persist-credentials: false

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            loom:
              - 'src/**'
              - 'tests/**'
              - 'package.json'
              - 'tsconfig.json'
              - 'vitest.config.ts'
              - 'scripts/**'
            rpc:
              - 'loom-rpc/**'
            analytics:
              - 'loom-analytics/**'
            flags:
              - 'loom-flags/**'
            placeholder:
              - 'loom-placeholder/**'
            create-loom:
              - 'create-loom/**'
            docs:
              - 'docs/**'

      - name: Build the matrix
        id: select
        env:
          F_LOOM: ${{ steps.filter.outputs.loom }}
          F_RPC: ${{ steps.filter.outputs.rpc }}
          F_ANALYTICS: ${{ steps.filter.outputs.analytics }}
          F_FLAGS: ${{ steps.filter.outputs.flags }}
          F_PLACEHOLDER: ${{ steps.filter.outputs.placeholder }}
          F_CREATE_LOOM: ${{ steps.filter.outputs.create-loom }}
        run: |
          # A change to core can break any sibling that builds against it, so
          # core forces the full set rather than only itself.
          if [ "$F_LOOM" = "true" ]; then
            PKGS='["loom","rpc","analytics","flags","placeholder","create-loom"]'
          else
            PKGS=$(node -e '
              const on = {
                rpc: process.env.F_RPC,
                analytics: process.env.F_ANALYTICS,
                flags: process.env.F_FLAGS,
                placeholder: process.env.F_PLACEHOLDER,
                "create-loom": process.env.F_CREATE_LOOM,
              };
              console.log(JSON.stringify(Object.keys(on).filter((k) => on[k] === "true")));
            ')
          fi
          echo "packages=$PKGS" >> "$GITHUB_OUTPUT"
          echo "any=$(node -e "console.log(JSON.parse(process.argv[1]).length > 0)" "$PKGS")" >> "$GITHUB_OUTPUT"
          echo "Selected: $PKGS"

  # ── Repo-wide invariants, cheap enough to always run ──
  invariants:
    runs-on: ubuntu-latest
    # Only this job can comment, and only on pull requests. Everything else
    # stays read-only.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do not leave the token in .git/config for the build to find.
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          link-core: "false"

      - name: No new production dependencies
        id: depcheck
        run: node scripts/check-dependencies.mjs

      # The petty part, and the useful part: say so on the PR rather than
      # leaving someone to open a red X and read a log.
      #
      # A pull_request run from a *fork* gets a read-only token, so this cannot
      # comment there -- it fails softly rather than failing the run, since the
      # check above has already recorded the verdict.
      - name: Say so on the pull request
        if: ${{ failure() && steps.depcheck.outputs.violations != '' && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const found = process.env.VIOLATIONS;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## no.',
                '',
                'Loom is zero-dependency, and the sibling packages depend on',
                '`@toyz/loom` and nothing else. This adds:',
                '',
                '```',
                found,
                '```',
                '',
                'Move it to `devDependencies`, or do it by hand. Every production',
                'dependency is code that ships to everyone who installs this, and',
                'a package you did not choose can be taken over by someone you',
                'have never heard of.',
              ].join('\n'),
            });
        env:
          VIOLATIONS: ${{ steps.depcheck.outputs.violations }}

      - name: Actions are pinned to commit SHAs
        run: node scripts/check-actions-pinned.mjs

      - name: Dependency ranges admit the core version
        run: node scripts/check-versions.mjs

  # ── Per-package gate ──
  package:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.changes.outputs.packages) }}
    name: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do not leave the token in .git/config for the build to find.
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Resolve package directory
        id: pkg
        run: |
          DIR=$(node --input-type=module -e "import('./scripts/packages.mjs').then(m=>console.log(m.byId(process.argv[1]).dir))" "${{ matrix.package }}")
          BUILDS=$(node --input-type=module -e "import('./scripts/packages.mjs').then(m=>console.log(m.byId(process.argv[1]).builds))" "${{ matrix.package }}")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "builds=$BUILDS" >> "$GITHUB_OUTPUT"

      # Not `npm ci`: between bumping a sibling's @toyz/loom range and
      # publishing that core version, the range resolves to nothing on the
      # registry. install-linked points it at this checkout instead.
      - name: Install (sibling)
        if: steps.pkg.outputs.dir != '.'
        run: node scripts/install-linked.mjs ${{ steps.pkg.outputs.dir }}

      - name: Link core
        if: steps.pkg.outputs.dir != '.'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm link @toyz/loom

      - name: Typecheck
        if: steps.pkg.outputs.builds == 'true'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npx tsc --noEmit

      - name: Type-level assertions
        if: matrix.package == 'loom'
        run: npm run test:types

      - name: Test
        if: steps.pkg.outputs.builds == 'true'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm test

      - name: Build
        if: steps.pkg.outputs.builds == 'true'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm run build

      # The published output must be resolvable by Node, not only by a bundler.
      # Every package shipped extensionless relative imports until 0.22.0; the
      # whole suite passed throughout, because tests resolve src/ via Vite.
      - name: dist is resolvable by Node
        if: steps.pkg.outputs.builds == 'true'
        run: node scripts/check-dist-esm.mjs ${{ matrix.package }}

      # create-loom has no source of its own; its gate is a real scaffold.
      - name: Scaffold, install, test and build a generated project
        if: matrix.package == 'create-loom'
        run: node scripts/smoke-create-loom.mjs

  # ── Docs build against src/, so they catch type-surface breaks early ──
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do not leave the token in .git/config for the build to find.
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build sibling packages
        run: |
          for dir in loom-rpc loom-analytics loom-flags loom-placeholder; do
            node scripts/install-linked.mjs "$dir"
            (cd "$dir" && npm link @toyz/loom && npm run build)
          done

      - name: Typecheck docs against src
        working-directory: docs
        run: npm ci && npm run tsc

      # Against the generated .d.ts as well: declaration emit can break in ways
      # src-path resolution hides.
      - name: Typecheck docs against dist
        working-directory: docs
        run: npx tsc -p tsconfig.dist.json --noEmit

      - name: Build docs
        working-directory: docs
        run: npm run build
