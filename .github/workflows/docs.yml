name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs Node, builds @toyz/loom and links it. The same steps were
      # inlined here and in six publish workflows before.
      - uses: ./.github/actions/setup

      # The docs import every sibling package, so all of them have to be built
      # and linked before the site will resolve.
      - name: Build sibling packages
        run: |
          for dir in loom-rpc loom-analytics loom-flags loom-placeholder; do
            (cd "$dir" && npm ci && npm link @toyz/loom && npm run build)
          done

      - name: Build docs
        working-directory: docs
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
