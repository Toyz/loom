name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Installs Node, builds @toyz/loom and links it. The same steps were
      # inlined here and in six publish workflows before.
      - uses: ./.github/actions/setup

      # The docs import every sibling package, so all of them have to be built
      # and linked before the site will resolve.
      - name: Build sibling packages
        run: |
          for dir in loom-rpc loom-analytics loom-flags loom-placeholder; do
            node scripts/install-linked.mjs "$dir"
            (cd "$dir" && npm link @toyz/loom && npm run build)
          done

      - name: Build docs
        working-directory: docs
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
