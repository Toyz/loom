      - generic [ref=e346]:
        - paragraph [ref=e347]: Querying the shadow root by hand goes wrong in two directions. Query too early — in the constructor or connect — and the template has not rendered, so you get null. Query once and cache the node, and the reference goes stale the moment a morph replaces that element.
        - paragraph [ref=e348]: "@query and @queryAll sidestep both by reading on every access. The accessor is a live lookup, not a stored node, so it is correct after any render and there is nothing to invalidate. The cost is a querySelector per read, which is why the parameterized form pre-compiles its selector at decoration time rather than building it per call."
