                - cell "When the element is defined, LoomElement's constructor finds a shadowRoot already present and keeps it, instead of calling attachShadow(). That is the entire hydration-specific code path — one branch." [ref=e552]
              - row "First render update() runs and its result is morphed against the shadow root, exactly as it would be on any later render. Matching nodes are left alone and the listeners and bindings attach to them." [ref=e553]:
