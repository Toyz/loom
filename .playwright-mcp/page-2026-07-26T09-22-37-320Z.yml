          - paragraph [ref=e556]: TIP Because the first render is an ordinary morph and not a comparison against an expected tree, server markup that disagrees with update() is simply corrected. There is no mismatch warning because there is no mismatch check — the morph does what it always does. Stale or approximate server HTML degrades into a small DOM patch rather than a thrown error or a blanked component.
