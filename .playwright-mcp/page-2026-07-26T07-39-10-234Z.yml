      - generic [ref=e350]:
        - generic [ref=e351]: Five punches, five jobs
        - generic [ref=e352]:
          - generic [ref=e353]:
            - generic [ref=e354]: "@component"
            - paragraph [ref=e355]: Registers the custom element. No manual customElements.define, no registry file to keep in sync.
          - generic [ref=e356]:
            - generic [ref=e357]: "@prop"
            - paragraph [ref=e358]: Exposes an observed attribute. Writing channel="#general" in HTML sets the field, coerced to the declared type.
          - generic [ref=e359]:
            - generic [ref=e360]: "@reactive"
            - paragraph [ref=e361]: Marks state the template depends on. Assigning to it schedules exactly one render for the tick.
          - generic [ref=e362]:
            - generic [ref=e363]: "@on"
            - paragraph [ref=e364]: Subscribes to a typed event on the bus for as long as the element is connected, and unsubscribes when it is not.
          - generic [ref=e365]:
            - generic [ref=e366]: "@interval"
            - paragraph [ref=e367]: Starts a timer on connect and clears it on disconnect. There is no clearInterval to forget.
      - generic [ref=e368]:
        - generic [ref=e369]: What that buys you
        - generic [ref=e370]:
          - generic [ref=e371]:
            - term [ref=e372]: No virtual DOM
            - definition [ref=e373]: JSX builds real DOM nodes. Updates run a keyed morph that touches only what changed, so focus, scroll position and text selection survive a re-render.
          - generic [ref=e374]:
            - term [ref=e375]: Fine-grained updates
            - definition [ref=e376]: A closure in your template binds to exactly the reactives it reads. Changing one patches that node instead of re-rendering the component.
          - generic [ref=e377]:
            - term [ref=e378]: Attributes are components
            - definition [ref=e379]:
              - code [ref=e380]: "@attribute"
              - text: attaches behaviour to any element, including ones Loom did not render. A tooltip or a hotkey becomes a directive rather than a wrapper.
          - generic [ref=e381]:
            - term [ref=e382]: Batteries, no tax
            - definition [ref=e383]: Router with guards, DI container, reactive stores with pluggable persistence, and a data-fetching layer — each importable on its own.
