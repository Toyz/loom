      - generic "State Management" [ref=e350]:
        - generic [ref=e351]:
          - heading "State Management" [level=1] [ref=e353]
          - paragraph [ref=e354]: Reactive primitives, component stores, and persistent storage — everything you need to manage state in Loom.
      - generic [ref=e356]:
        - paragraph [ref=e357]: Loom has five ways to declare state, which sounds like four too many until you notice they answer different questions. Does a change to a nested field count. Does the value survive a reload. Is it derived from other state. Does anything outside the component need to read it.
        - paragraph [ref=e358]: Pick by answering those, not by reaching for the most powerful one. @reactive is the default and covers most fields; the others each add one capability and the cost that comes with it.
