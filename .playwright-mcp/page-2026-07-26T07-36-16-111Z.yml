              - generic [ref=e341]:
                - generic [ref=e342]: tsx
                - button "Copy" [ref=e343] [cursor=pointer]
              - code [ref=e346]: "@component(\"unread-badge\") export class UnreadBadge extends LoomElement { @prop accessor channel = \"\"; @reactive accessor count = 0; @on(MessageReceived) bump(e: MessageReceived) { if (e.channel === this.channel) this.count++; } @interval(30_000) resync() { this.count = unreadFor(this.channel); } update() { return <b hidden={() => this.count === 0}>{() => this.count}</b>; } }"
              - generic [ref=e347]:
                - generic [ref=e348]: 0 DEPENDENCIES
                - generic [ref=e349]: ~8KB GZIPPED
                - generic [ref=e350]: 41 DECORATORS
                - generic [ref=e351]: TYPESCRIPT
      - generic [ref=e352]:
        - generic [ref=e353]:
          - term [ref=e354]: No virtual DOM
          - definition [ref=e355]: JSX builds real DOM nodes. Updates run a keyed morph that touches only what changed, so focus, scroll position and text selection survive a re-render.
        - generic [ref=e356]:
          - term [ref=e357]: Nothing to clean up
          - definition [ref=e358]: Timers, listeners, observers, subscriptions and in-flight requests are released when the element leaves the DOM. The decorator that starts the work registers its own teardown.
        - generic [ref=e359]:
          - term [ref=e360]: Fine-grained updates
          - definition [ref=e361]:
            - text: A closure in your template —
            - code [ref=e362]: "{() => this.count}"
            - text: — binds to exactly the reactives it reads, and changing one patches that node instead of re-rendering the component.
        - generic [ref=e363]:
          - term [ref=e364]: Attributes are components too
          - definition [ref=e365]:
            - code [ref=e366]: "@attribute"
            - text: attaches behaviour to any element, including ones Loom did not render. A tooltip or a hotkey becomes a directive rather than a wrapper.
        - generic [ref=e367]:
          - term [ref=e368]: Batteries, not a framework tax
          - definition [ref=e369]: Router with guards, DI container, reactive stores with pluggable persistence, and a data-fetching layer — each importable on its own.