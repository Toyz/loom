        - generic [ref=e327]:
          - generic [ref=e328]:
            - paragraph [ref=e329]: Web components where state, timing, events, routing and DOM access are declared on the line above the code that uses them. No virtual DOM and no compiler of our own — TypeScript decorators, JSX, and the platform.
