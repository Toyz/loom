      - generic [ref=e381]:
        - paragraph [ref=e382]: The single most common lifecycle bug in web components is assuming connectedCallback runs once. It runs every time the element enters the DOM, and moving an element — appendChild to a new parent, a reorder inside a morph — disconnects and reconnects it. Setup written as "run once" silently runs three times.
        - paragraph [ref=e383]: Loom's hooks are explicit about which side of that line they sit on. @mount and @unmount pair up per connection. firstUpdated runs after the first render only. @suspend and @catch wrap async work and errors so a failed load renders a state instead of a blank element.
