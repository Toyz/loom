          - code [ref=e574]: "import { LoomElement, component, reactive, debounce, throttle } from \"@toyz/loom\"; interface Person { id: string; name: string } @component(\"people-search\") export class PeopleSearch extends LoomElement { @reactive accessor term = \"\"; @reactive accessor local: Person[] = []; @reactive accessor pending = false; private cache: Person[] = []; // Instant feedback per keystroke, capped at ten filter passes a second. @throttle(100) private filterLocal(term: string) { const q = term.toLowerCase(); this.local = this.cache.filter((p) => p.name.toLowerCase().includes(q)); } // One request, once typing stops. @debounce(300) private async fetchRemote(term: string) { if (!term) { this.pending = false; return; } this.pending = true; const res = await fetch(`/api/people?q=${encodeURIComponent(term)}`); this.cache = await res.json(); this.filterLocal(term); this.pending = false; } private onInput(e: Event) { this.term = (e.target as HTMLInputElement).value; this.filterLocal(this.term); this.fetchRemote(this.term); } update() { return ( <div> <input value={this.term} onInput={(e) => this.onInput(e)} placeholder=\"Search people\" /> {() => this.pending ? <span>Searching…</span> : null} <ul> {this.local.map((p) => <li loom-key={p.id}>{p.name}</li>)} </ul> </div> ); } }"
