          - heading "Why there is no subscribe call" [level=3] [ref=e872]
          - paragraph [ref=e873]: Reading todos.value inside update() records the store as a dependency of that render. When it changes, Loom re-renders exactly the components that read it. Keeping a local copy in sync by hand is the bug this design removes, not a feature it is missing.
