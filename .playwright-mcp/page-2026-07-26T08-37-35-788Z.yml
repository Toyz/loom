      - generic [ref=e373]:
        - paragraph [ref=e374]: "A raw web component makes you write the plumbing yourself: observedAttributes, an attributeChangedCallback that parses strings by hand, a render call you remember to make, and a matching teardown for every listener and timer you started. Most of that code is identical in every component, and the parts that differ are the parts people get wrong."
        - paragraph [ref=e375]: LoomElement reduces it to one method. You write update() returning DOM; everything else is declared with a decorator and torn down for you when the element disconnects. There is no virtual DOM in between — update() builds real nodes, and a re-render morphs the existing tree in place rather than replacing it.
